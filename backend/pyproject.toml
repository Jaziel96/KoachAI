[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koach"
version = "0.1.0"
description = "Agente de salud proactivo por WhatsApp para mexicanos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "structlog>=24.1,<25.0",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "sentry-sdk[fastapi]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.9,<2.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
